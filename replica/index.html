<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "PatrickHand"; src: url("./assets/fonts/PatrickHand-Regular.ttf") format("truetype"); }
      @font-face { font-family: "LuckiestGuy"; src: url("./assets/fonts/LuckiestGuy-Regular.ttf") format("truetype"); }
      @font-face { font-family: "CaveatBrush"; src: url("./assets/fonts/CaveatBrush-Regular.ttf") format("truetype"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #ede7d4; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ede7d4; }
      #stage { position: absolute; inset: 0; }
      #cv { display: block; width: 100%; height: 100%; }
      .warm { position: absolute; left: 0; bottom: 0; font-size: 2px; color: #ede7d4; }
      .w1 { font-family: "PatrickHand", sans-serif; }
      .w2 { font-family: "LuckiestGuy", sans-serif; }
      .w3 { font-family: "CaveatBrush", sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="30" data-track-index="0">
        <canvas id="cv" width="1920" height="1080" data-layout-allow-overflow></canvas>
        <div class="warm w1" data-layout-ignore>Adjust Sparkle</div>
        <div class="warm w2" data-layout-ignore>WAIT FOR IT</div>
        <div class="warm w3" data-layout-ignore>Opus 5.5</div>
      </div>
    </div>

    <script>
      // ============ replaceable copy (matches the 【】 slots in prompts/editor-replica.md) ============
      const FILE_NAME = "opus_edit_FINAL_final(2).mp4";
      const MEDIA = ["sunrise.mp4", "coffee.mp4", "cat.mov", "dance.mp4"];
      const MUSIC_NAME = "lyria_track.wav";
      const LINES = {
        newProject: "new project!", boring: "the boring part zzz", snip: "SNIP!", yeet: "YEET!",
        cleaner: "much cleaner.", spin: "SPIN!", whoosh: "WHOOSH!", hmm: "hmm?", fixed: "FIXED",
        shakeMax: "SHAKE: MAX", nobody: "...nobody saw that.", onBeat: "ON BEAT!", exportPop: "EXPORT!",
      };
      const CAPTION_STEPS = ["WAIT", "WAIT FOR", "WAIT FOR TI"]; // the typo gag
      const CAPTION = "WAIT FOR IT";
      const FINAL_CAPTION = ["NAILED", "IT!"];
      const OUTRO = { small: "made in 30 seconds by", big: "Opus 5.5", sign: "— signing off ✦" };
      const HANDLE = "@opus5.5", TAGS = "#editing #beatsync";
      // ===============================================================================================

      const W = 1920, H = 1080, DURATION = 30, PI = Math.PI;
      const cv = document.getElementById("cv"), g = cv.getContext("2d");
      const UI = '"PatrickHand", sans-serif', POP = '"LuckiestGuy", sans-serif', HAND = '"CaveatBrush", cursive';
      const C = {
        bg: "#ede7d4", win: "#f9f4ea", panel: "#fbf8f1", tl: "#fefdf6", ink: "#2b2118", soft: "#d8d0c2", mute: "#8f877a",
        yellow: "#f2c23f", gold: "#e6b134", teal: "#31a192", tealL: "#c6ebe2", wave: "#3fb39c", red: "#e5484d",
        pink: "#f27aa0", purple: "#6c6cf0", green: "#5bbf5f", body: "#d38959", bodyD: "#c47a4b",
      };

      // ---------- math ----------
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const eo = (x) => 1 - Math.pow(1 - x, 3);
      const backOut = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
      const pulse = (t, a, b, r = 0.12) => Math.min(seg(t, a, a + r), 1 - seg(t, b - r, b));
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
      const noise = (x) => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u) * 2 - 1; };
      const pad = (n) => String(n).padStart(2, "0");
      function trk(t, K) {
        if (t <= K[0][0]) return K[0][1];
        for (let i = 1; i < K.length; i++) if (t < K[i][0]) {
          const [t0, v0] = K[i - 1], [t1, v1, e] = K[i], u = (t - t0) / (t1 - t0);
          return v0 + (v1 - v0) * (e === "lin" ? u : e === "eo" ? eo(u) : eio(u));
        }
        return K[K.length - 1][1];
      }

      // ---------- hand-drawn primitives ----------
      function rrPath(x, y, w, h, r, j = 1, seed = 0) {
        r = Math.max(0, Math.min(r, w / 2, h / 2));
        const pts = [], step = 14;
        const line = (x1, y1, x2, y2) => { const n = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1) / step)); for (let i = 0; i < n; i++) pts.push([x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n]); };
        const arc = (cx, cy, a0, a1) => { const n = Math.max(2, Math.round(r / 5)); for (let i = 0; i < n; i++) { const a = a0 + ((a1 - a0) * i) / n; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
        line(x + r, y, x + w - r, y); arc(x + w - r, y + r, -PI / 2, 0);
        line(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0, PI / 2);
        line(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, PI / 2, PI);
        line(x, y + h - r, x, y + r); arc(x + r, y + r, PI, 1.5 * PI);
        const sd = seed + x * 0.013 + y * 0.029;
        g.beginPath();
        pts.forEach((p, i) => { const px = p[0] + noise(i * 0.41 + sd) * j, py = p[1] + noise(i * 0.41 + sd + 77) * j; i ? g.lineTo(px, py) : g.moveTo(px, py); });
        g.closePath();
      }
      function box(x, y, w, h, r, fill, stroke = C.ink, lw = 3, j = 0.8, seed = 0) {
        rrPath(x, y, w, h, r, j, seed);
        if (fill) { g.fillStyle = fill; g.fill(); }
        if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.lineJoin = "round"; g.stroke(); }
      }
      function txt(s, x, y, size, color = C.ink, align = "center", font = UI) {
        g.font = `${size}px ${font}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle"; g.fillText(s, x, y);
      }
      function outlined(s, x, y, size, fill, lw, stroke = C.ink, align = "center", font = POP) {
        g.font = `${size}px ${font}`; g.textAlign = align; g.textBaseline = "middle"; g.lineJoin = "round";
        if (lw > 0) { g.strokeStyle = stroke; g.lineWidth = lw; g.strokeText(s, x, y); }
        g.fillStyle = fill; g.fillText(s, x, y);
      }
      function wline(pts, color, lw, seed = 0, j = 0.8) {
        g.beginPath();
        pts.forEach(([x, y], i) => { const px = x + noise(i * 0.7 + seed) * j, py = y + noise(i * 0.7 + seed + 9) * j; i ? g.lineTo(px, py) : g.moveTo(px, py); });
        g.strokeStyle = color; g.lineWidth = lw; g.lineCap = "round"; g.lineJoin = "round"; g.stroke();
      }
      function ell(x, y, rx, ry, fill, stroke, lw = 3) {
        g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, PI * 2);
        if (fill) { g.fillStyle = fill; g.fill(); }
        if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
      }
      function star4(x, y, r, color, rot = 0, stroke = null) {
        g.save(); g.translate(x, y); g.rotate(rot); g.beginPath();
        for (let i = 0; i < 8; i++) { const a = (i * PI) / 4, rr = i % 2 ? r * 0.3 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
        g.closePath(); g.fillStyle = color; g.fill(); if (stroke) { g.strokeStyle = stroke; g.lineWidth = Math.max(1, r * 0.18); g.stroke(); } g.restore();
      }

      // ---------- paper grain (built once, deterministic) ----------
      const grain = document.createElement("canvas"); grain.width = W; grain.height = H;
      (() => {
        const q = grain.getContext("2d"); let s = 11; const r = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        for (let i = 0; i < 16000; i++) { const dark = r() < 0.6; q.fillStyle = dark ? `rgba(90,70,40,${0.02 + r() * 0.045})` : `rgba(255,255,250,${0.05 + r() * 0.07})`; q.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2); }
        for (let i = 0; i < 240; i++) { q.strokeStyle = `rgba(110,90,60,${0.025 + r() * 0.035})`; q.lineWidth = 1; q.beginPath(); const x = r() * W, y = r() * H, a = r() * PI; q.moveTo(x, y); q.lineTo(x + Math.cos(a) * (8 + r() * 22), y + Math.sin(a) * (8 + r() * 22)); q.stroke(); }
      })();

      // ---------- world layout (1920x1080 = the reference frame x1.5) ----------
      const PHONE = { cx: 960, cy: 354, w: 282, h: 498 };
      const FEET = 742, GROUND2 = 960;
      const TL0 = 142, PPS = 106; // ruler origin + px per second
      const VT = { y: 750, h: 90 }, TT = { y: 690, h: 36 }, MT = { y: 862, h: 58 }, MARK_Y = 972;
      const CELL = (i) => ({ x: 82 + (i % 2) * 171, y: 170 + Math.floor(i / 2) * 142, w: 152, h: 118 });
      const CELLC = (i) => { const c = CELL(i); return { x: c.x + c.w / 2, y: c.y + 46 }; };
      const SL = { x0: 1525, x1: 1827, rows: [216, 306, 397, 487] };
      const KINDS = ["sunrise", "coffee", "cat", "dance"];
      const CLIP_X = [120, 426, 1014, 1311], CLIP_W = [294, 576, 285, 288];
      const GRAY_X = 738, GRAY_W = 264, CUT_SHIFT = 264;
      const BORDER = { sunrise: "#e6b134", coffee: "#e2606f", cat: "#8676e6", dance: "#2fa58e" };
      const LIFT = [1.6, 2.15, 2.65, 3.15], LAND = LIFT.map((s) => s + 0.45);
      const BEATS = [20.5, 21.0, 21.5, 22.0, 22.5, 23.0];
      const BEAT_X = [320, 474, 630, 784, 939, 1093];

      // ---------- timeline state ----------
      const cutK = (t) => eio(seg(t, 5.95, 6.25));
      function clipRects(t) {
        const out = [];
        for (let i = 0; i < 4; i++) {
          if (t < LAND[i]) continue;
          let x = CLIP_X[i], w = CLIP_W[i];
          if (i === 1 && t >= 4.98) w = GRAY_X - CLIP_X[1] - 4;
          if (i >= 2) x -= CUT_SHIFT * cutK(t);
          out.push({ i, kind: KINDS[i], x, w, land: t - LAND[i] });
        }
        return out;
      }
      const musicEnd = (t) => lerp(180, 1827, eo(seg(t, 1.1, 1.75)));
      const typed = (t) => (t < 12.45 ? "" : t < 12.95 ? CAPTION_STEPS[0] : t < 13.45 ? CAPTION_STEPS[1] : t < 14.85 ? CAPTION_STEPS[2] : CAPTION);
      const textClip = (t) => { const s = typed(t); if (!s) return null; const base = s.length < 6 ? 92 : s.length < 10 ? 130 : 168; return { x: 712, w: lerp(base, 272, eio(seg(t, 16.15, 16.45))) }; };
      const charX = (t) => trk(t, XK);
      function playheadX(t) {
        if (t >= 20.15 && t < 23.0) return lerp(trk(t, PH), charX(t), seg(t, 20.15, 20.5));
        return trk(t, PH);
      }
      const PH = [[0, 142], [3.5, 142], [3.9, 352], [4.25, 830], [4.95, 830], [5.05, 498], [7.75, 585, "lin"], [8.45, 405], [9.3, 405], [9.8, 597], [11.5, 597], [11.95, 800], [16.2, 800], [16.5, 1074], [20.15, 1074], [23.0, 1093], [23.35, 142], [23.45, 142], [24.3, 1284, "lin"], [30, 1284]];
      function sliders(t) {
        const sparkle = lerp(0, 0.55, eio(seg(t, 16.6, 16.8))) + 0.15 * eio(seg(t, 16.8, 17.0));
        let shake = lerp(0, 0.9, eio(seg(t, 17.03, 17.22))) + 0.1 * eio(seg(t, 17.22, 17.33));
        shake = lerp(shake, 0.05, eio(seg(t, 18.85, 19.0)));
        const zoom = 0.02 * seg(t, 19.38, 19.45) + 0.58 * eio(seg(t, 19.45, 19.75));
        return [sparkle, shake, zoom, 0.33];
      }

      // ---------- character choreography ----------
      const XK = [[0, -10], [0.5, 92, "lin"], [1.0, 270, "eo"], [1.4, 280], [3.6, 280], [4.3, 562], [7.7, 562], [8.25, 546], [12.0, 546], [12.4, 880], [16.15, 880], [16.55, 1330], [19.95, 1330], [20.5, 320, "lin"], [21.0, 474, "lin"], [21.5, 630, "lin"], [22.0, 784, "lin"], [22.5, 939, "lin"], [23.0, 1093, "lin"], [24.2, 1093], [24.45, 1250, "lin"], [24.75, 1400, "lin"], [25.05, 1475, "lin"], [30, 1475]];
      const JUMPS = [[9.98, 10.62, 120], [19.95, 20.5, 250], [20.5, 21.0, 60], [21.0, 21.5, 60], [21.5, 22.0, 60], [22.0, 22.5, 60], [22.5, 23.0, 60], [24.2, 24.45, 80], [24.45, 24.75, 90], [24.75, 25.05, 60]];
      const LANDS = [10.62, 20.5, 21.0, 21.5, 22.0, 22.5, 23.0, 24.45, 24.75, 25.05];
      const WALKS = [[0, 1.0], [3.6, 4.3], [7.7, 8.25], [12.0, 12.4], [16.15, 16.55]];

      function reachAt(t) {
        // spin transition: grab it from the library, drop it between clip 1 and 2
        if (t >= 8.68 && t < 9.3) {
          const a = CELLC(1), cr = eio(seg(t, 8.98, 9.15));
          return { tx: lerp(a.x, 420, cr), ty: lerp(a.y, VT.y + VT.h / 2, cr), k: t < 9.15 ? eo(seg(t, 8.68, 8.92)) : 1 - eio(seg(t, 9.15, 9.3)), item: t >= 8.92 && t < 9.15 ? "spin" : null, via: t < 8.85 ? CELLC(3) : null, viaK: seg(t, 8.68, 8.85) };
        }
        // whoosh transition
        // poke the typo straight up
        if (t >= 14.45 && t < 14.95) return { tx: PHONE.cx + 62 + Math.sin(t * 50) * 3 * pulse(t, 14.6, 14.85, 0.03), ty: PHONE.cy + PHONE.h * 0.27, k: t < 14.85 ? eo(seg(t, 14.45, 14.6)) : 1 - eio(seg(t, 14.85, 14.95)) };
        // sliders
        const sv = sliders(t), kx = (v) => SL.x0 + v * (SL.x1 - SL.x0);
        if (t >= 16.55 && t < 17.43) {
          if (t < 16.95) return { tx: kx(sv[0]), ty: SL.rows[0], k: eo(seg(t, 16.55, 16.65)) };
          const m = eio(seg(t, 16.95, 17.03));
          return { tx: lerp(kx(0.7), kx(sv[1]), m), ty: lerp(SL.rows[0], SL.rows[1], m), k: 1 - eio(seg(t, 17.33, 17.43)) };
        }
        if (t >= 18.75 && t < 19.1) return { tx: kx(sv[1]), ty: SL.rows[1], k: Math.min(eo(seg(t, 18.75, 18.85)), 1 - eio(seg(t, 19.0, 19.1))) };
        if (t >= 19.3 && t < 19.88) return { tx: kx(sv[2]), ty: SL.rows[2], k: Math.min(eo(seg(t, 19.3, 19.42)), 1 - eio(seg(t, 19.78, 19.88))) };
        // press EXPORT
        if (t >= 22.85 && t < 23.6) return { tx: 1752, ty: 52 + 5 * pulse(t, 23.15, 23.3, 0.04), k: t < 23.35 ? eo(seg(t, 22.85, 23.1)) : 1 - eio(seg(t, 23.35, 23.6)) };
        return null;
      }

      function charState(t) {
        const o = { t, x: charX(t), y: 0, rot: 0, sx: 1, sy: 1, sc: 1, face: "dot", look: 0, armL: 0, armR: 0, walk: null, dizzy: 0, sweat: 0, blush: 0, boil: Math.floor(t * 8) };
        const fin = eio(seg(t, 24.75, 25.05));
        o.sc = lerp(1, 1.5, eio(seg(t, 24.45, 24.75))) + 0.16 * fin;
        let h = 0;
        for (const [a, b, hh] of JUMPS) if (t >= a && t < b) { const u = (t - a) / (b - a); h = hh * Math.sin(PI * u); o.sy *= 1.06; o.sx *= 0.96; if (b - a <= 0.5 && hh < 100) o.rot = Math.sin(PI * u) * 0.1; }
        o.y = lerp(FEET, GROUND2, fin) - h;
        for (const [a, b] of WALKS) if (t >= a && t < b) { o.walk = (t - a) * 22; o.y -= Math.abs(Math.sin(o.walk)) * 5; }
        for (const L of LANDS) { const d = t - L; if (d >= 0 && d < 0.4) { const a = 0.2 * Math.exp(-d * 10) * Math.cos(d * 22); o.sy *= 1 - a; o.sx *= 1 + a * 0.7; } }
        if (t >= 19.95 && t < 20.5) o.rot = -0.5 * Math.sin(PI * seg(t, 19.95, 20.5));
        if (t >= 9.98 && t < 10.62) { const u = seg(t, 9.98, 10.62); o.rot = -(u * 0.6 + eio(u) * 0.4) * PI * 4; }
        o.dizzy = pulse(t, 10.62, 11.3, 0.06);
        o.rot += 0.12 * pulse(t, 4.9, 5.3, 0.1) + 0.24 * pulse(t, 5.2, 5.95, 0.12);
        if (t >= 17.33 && t < 18.75) { o.x += Math.sin(t * 70) * 4; o.rot = Math.sin(t * 47) * 0.08; }
        const up = Math.max(pulse(t, 1.4, 2.0), pulse(t, 6.4, 6.95), pulse(t, 17.3, 18.75), pulse(t, 24.45, 25.0));
        o.armL = o.armR = up + (t > 17.33 && t < 18.75 ? Math.sin(t * 24) * 0.2 : 0);
        if (t >= 11.15 && t < 11.7) o.armR = 1.35 * pulse(t, 11.15, 11.7, 0.08);
        if (t >= 9.98 && t < 10.62) o.armL = o.armR = 0.5;
        if (t >= 20.5 && t < 23.0) o.armR = 0.6 + 0.4 * Math.sin(t * 12);
        if (t >= 25.1) { const tail = Math.sin(t * 9) * 0.12; if (t < 27.45) { o.armL = 1.45 + tail; o.armR = 0; } else if (t < 28.85) { o.armL = 0; o.armR = 0; } else { o.armL = 0; o.armR = 1.45 + tail; } }
        const happy = [[6.85, 7.95], [14.85, 15.75], [16.9, 17.2], [20.5, 23.0], [24.45, 27.0], [28.0, 28.4], [29.6, 30]];
        if (happy.some(([a, b]) => t >= a && t < b)) o.face = "happy";
        if ((t >= 4.95 && t < 5.4) || (t >= 13.85 && t < 14.45) || (t >= 16.3 && t < 16.6) || (t >= 9.7 && t < 9.95) || (t >= 18.85 && t < 19.05)) o.face = "flat";
        if (t >= 29.0 && t < 29.6) o.face = "wink";
        if (o.dizzy > 0.01) o.face = "dizzy";
        if (t >= 9.98 && t < 10.62) o.face = "flat";
        if (t >= 19.05 && t < 19.9) o.look = Math.sin((t - 19.05) * 7) > 0 ? 1 : -1;
        o.sweat = Math.max(pulse(t, 17.33, 18.75), pulse(t, 19.05, 19.9));
        o.blush = seg(t, 24.75, 25.2);
        const r = reachAt(t);
        if (r) {
          const side = r.tx >= o.x ? 1 : -1;
          const sh = { x: o.x + side * 92 * o.sc * o.sx, y: o.y - 152 * o.sc * o.sy };
          let tx = r.tx, ty = r.ty;
          if (r.via) { tx = lerp(r.via.x, r.tx, eio(r.viaK)); ty = lerp(r.via.y, r.ty, eio(r.viaK)); }
          r.tipX = lerp(sh.x, tx, r.k); r.tipY = lerp(sh.y, ty, r.k); r.side = side;
          o.reach = r;
        }
        return o;
      }

      // ---------- the orange block creature ----------
      // origin = between the feet; body 220x122, four legs 46 tall, two side stubs, two bar eyes
      function creature(o) {
        const pivot = 107 * (o.sc || 1);
        g.save(); g.translate(o.x, o.y - pivot); g.rotate(o.rot || 0); g.translate(0, pivot); g.scale(o.sc * (o.sx || 1), o.sc * (o.sy || 1));
        const b = (o.boil || 0) * 7.3, t = o.t || 0, BW = 220, BH = 122, top = -46 - BH;
        [-85, -47, 47, 85].forEach((lx, i) => {
          const lift = o.walk != null ? Math.max(0, Math.sin(o.walk + (i % 2) * PI)) * 9 : 0;
          box(lx - 11, -50, 22, 50 - lift, 3, C.body, C.ink, 3, 0.4, b + i);
        });
        // side stubs: raise 0 = sideways nub, 1 = up-out, >1.2 = straight up
        const stub = (side, raise) => {
          g.save(); g.translate(side * 108, top + 52); g.rotate(side * lerp(0, -1.0, clamp(raise, 0, 1)) + side * -0.55 * clamp(raise - 1, 0, 1));
          const L = lerp(30, 46, clamp(raise, 0, 1)), T = lerp(30, 24, clamp(raise, 0, 1));
          box(side > 0 ? -4 : -L + 4, -T / 2, L, T, 3, C.body, C.ink, 3, 0.4, b + side);
          g.restore();
        };
        if (!(o.reach && o.reach.side < 0)) stub(-1, o.armL || 0);
        if (!(o.reach && o.reach.side > 0)) stub(1, o.armR || 0);
